name: Update DTM RSS Feed

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedgen lxml

      - name: Spuštění skriptů
        run: |
          python convert_to_rss.py
          python convert_to_rss_sz.py
          python convert_to_rss_sz_files.py

      - name: Commit a Push změn
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Přidáme soubory, pokud existují
          git add feed.xml feed_sz.xml feed_sz_files.xml news_cache.json files_cache.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizace RSS feedů a cache: $(date +'%Y-%m-%d %H:%M')" && git push)
