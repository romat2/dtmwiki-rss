name: Update DTM RSS Feed

on:
  schedule:
    - cron: '0 8 * * *'  # Každý den v 8:00 ráno (UTC)
  workflow_dispatch:      # Možnost spustit ručně z webu GitHubu
  push:
    branches:
      - main              # Spustit při každém pushi do main větve

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Důležité pro GitHub Actions, aby mohlo zapisovat do repozitáře
    permissions:
      contents: write

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Spuštění skriptů
        run: |
          python convert_to_rss.py
          python convert_to_rss_sz.py

      - name: Commit a Push změn
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add feed.xml feed_sz.xml news_cache.json
          # Commitne se jen pokud se některý ze souborů změnil
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizace RSS feedů a cache: $(date +'%Y-%m-%d %H:%M')" && git push)
